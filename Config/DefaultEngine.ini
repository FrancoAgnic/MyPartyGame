[/Script/Engine.GameEngine]
; SteamSockets enruta el trafico real de juego (no el matchmaking, eso ya iba por Steam)
; a traves de los relays de Valve, asi evita pedirle a cada jugador que abra puertos en su
; router. Solo se activa en build empaquetado/standalone (-game), no en el Editor/PIE — ahi
; cae solo al fallback de IpNetDriver de toda la vida.
; IMPORTANTE: el motor resuelve esta clase con StaticLoadClass, que requiere el prefijo
; "/Script/" (ver BaseEngine.ini: todas las entradas nativas de NetDriverDefinitions lo usan).
; Sin el prefijo, StaticLoadClass no encuentra la clase y el motor cae al fallback en
; silencio (sin loguear ningún error) — eso hacía que SteamSocketsNetDriver nunca se usara.
+NetDriverDefinitions=(DefName="GameNetDriver",DriverClassName="/Script/SteamSockets.SteamSocketsNetDriver",DriverClassNameFallback="/Script/OnlineSubsystemUtils.IpNetDriver")

; ============================================================
; Online Subsystem — Steam (sesiones online reales vía Steam Matchmaking)
; App ID REAL de Sculpturillo: 5114580. Ya NO usamos Spacewar (480). En el editor/PIE, para
; que las sesiones anden, la cuenta de dev tiene que POSEER el juego (developer comp) y Steam
; estar abierto. Lanzado desde Steam, el cliente ya provee el 5114580.
; ============================================================
[OnlineSubsystem]
DefaultPlatformService=Steam

[OnlineSubsystemSteam]
bEnabled=True
SteamDevAppId=5114580
; Habilita el SteamSockets NetDriver (en vez de quedar atado al IpNetDriver de siempre).
bUseSteamNetworking=True
; Permite que la conexion pase por los relays de Valve si el NAT-punchthrough directo falla
; (el caso tipico de dos jugadores en redes/paises distintos, como el test pendiente).
bAllowP2PPacketRelay=True
bRelaunchInSteam=False

; ============================================================
; Timeouts de red — RECONEXIÓN (2026-08-21)
; Bug: al reconectarse un jugador caído mientras el host todavía tenía su conexión VIEJA sin
; limpiar (~11s por default), el host rechazaba el handshake nuevo → el motor reintentaba solo el
; Browse ~cada 1.2s abriendo una conexión SteamSockets nueva por vez desde el MISMO SteamID → se
; apilaban conexiones con la misma dirección y el host CRASHEABA con la assertion de UE
; "MappedClientConnections.Remove(ConstAddrRef) == 1" (NetDriver.cpp:7136) → se caía la sesión y
; todos volvían al menú.
; Fix (host): soltar rápido a un caído (ConnectionTimeout=6s) para que su conexión vieja NO
; colisione con la reconexión. KeepAliveTime bajo mantiene vivas las conexiones sanas (mandan
; keepalive cada 0.2s, muy dentro de los 6s), así un jugador que NO está caído no se cae por esto.
; El cliente además hace UN solo intento con guard anti-flood (ver UPTGameInstance).
; Contra aceptado por el usuario: un corte real de red de ~6s en partida te desconecta.
[/Script/SteamSockets.SteamSocketsNetDriver]
InitialConnectTimeout=12.0
ConnectionTimeout=6.0
KeepAliveTime=0.2
TimeoutMultiplierForUnoptimizedBuilds=1.0

[/Script/OnlineSubsystemUtils.IpNetDriver]
InitialConnectTimeout=12.0
ConnectionTimeout=6.0
KeepAliveTime=0.2
TimeoutMultiplierForUnoptimizedBuilds=1.0

