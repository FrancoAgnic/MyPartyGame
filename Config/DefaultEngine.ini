[ConsoleVariables]
; Permite testear el seamless travel (Lobby→Lvl-01) en PIE con 2+ instancias.
; Por defecto PIE lo desactiva y cae a hard travel, que SUELTA a los clientes
; (solo viaja el host). Esto NO afecta la build empaquetada (que ya usa seamless).
net.AllowPIESeamlessTravel=1

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Template/levels/BootLVl.BootLVl
EditorStartupMap=/Game/Template/levels/Lvl-01.Lvl-01
; TransitionMap: nivel de transición LIVIANO (Empty Level, sin GameMode ni actores) para el
; seamless travel. OJO: debe ser vacío. Antes apuntaba a Lobby.Lobby (un nivel de gameplay
; completo) y eso rompía el viaje para los clientes (solo llegaba el host). Un mundo de
; transición explícito y vacío da un handoff más limpio (descarga el mundo viejo antes de
; cargar el destino pesado como MainMenu), para que el cliente no cuelgue al volver al lobby.
TransitionMap=/Game/Template/levels/TransitionMap.TransitionMap
GlobalDefaultGameMode=/Game/Variant_Combat/Blueprints/BP_CombatGameMode.BP_CombatGameMode_C
bOffsetPlayerGamepadIds=False
GameInstanceClass=/Game/Template/Character/BP_GameInstance.BP_GameInstance_C

