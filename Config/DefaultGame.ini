; Los textos de la UI y el banco de palabras son CSV SUELTOS (Content/Localization/*.csv), no
; assets: hay que empaquetarlos a mano o el juego sale sin traducciones y sin palabras.
; UFS = van adentro del pak y FFileHelper los lee igual que en el editor.
; (Antes esto forzaba el cook de /Game/Template/Data por el DT_WordBank; esos DataTables ya no
;  existen — los reemplazaron los CSV, que son los que permiten sumar idiomas sin recompilar.)
; OJO: la ruta es relativa a Content/ — poner "Content/Localization" hace que busque
; Content/Content/Localization y los CSV quedan AFUERA del pak sin que el build falle.
+DirectoriesToAlwaysStageAsUFS=(Path="Localization")
; PNG del cursor por defecto (hardware cursor, ver [/Script/Engine.UserInterfaceSettings] en
; DefaultEngine.ini). Es un PNG suelto (no uasset) → si no se stagea, el build sale sin cursor custom.
+DirectoriesToAlwaysStageAsUFS=(Path="UI/Cursors")
; PNG por defecto de miniatura del Workshop (se lee el PNG suelto, no el uasset). Sin esto, en el
; build empaquetado no estaría y el fallback caería al PNG sólido de relleno.
+DirectoriesToAlwaysStageAsUFS=(Path="UI/Workshop")
