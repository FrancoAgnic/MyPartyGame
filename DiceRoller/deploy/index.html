<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tirar Dados</title>
<style>
  :root {
    --bg1: #1a1147;
    --bg2: #3b1d6e;
    --accent: #ffd447;
    --die: #fdfdfd;
    --pip: #2a2140;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    background: radial-gradient(circle at 50% 0%, var(--bg2), var(--bg1));
    color: #fff;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    padding: 2rem 1rem;
    text-align: center;
    user-select: none;
  }
  h1 {
    font-size: clamp(1.8rem, 6vw, 3rem);
    letter-spacing: 1px;
    text-shadow: 0 4px 18px rgba(0,0,0,.4);
  }
  h1 span { color: var(--accent); }

  .dice {
    display: flex;
    gap: clamp(1.2rem, 5vw, 3rem);
    perspective: 800px;
  }
  .die {
    width: clamp(80px, 22vw, 130px);
    height: clamp(80px, 22vw, 130px);
    background: linear-gradient(145deg, #ffffff, #dfe1ea);
    border-radius: 22%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 14%;
    gap: 6%;
    box-shadow: 0 12px 30px rgba(0,0,0,.45), inset 0 -6px 12px rgba(0,0,0,.12);
  }
  .die.rolling { animation: shake .5s ease infinite; }
  @keyframes shake {
    0%,100% { transform: rotate(0) translateY(0); }
    25% { transform: rotate(-14deg) translateY(-8px); }
    50% { transform: rotate(10deg) translateY(4px); }
    75% { transform: rotate(-6deg) translateY(-4px); }
  }
  .pip {
    width: 100%; height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #5a4f7a, var(--pip));
    align-self: center;
    justify-self: center;
    box-shadow: inset 0 2px 3px rgba(0,0,0,.4);
  }
  /* posiciones de puntos por celda de grilla 3x3 */
  .p1 { grid-area: 1 / 1; } .p2 { grid-area: 1 / 2; } .p3 { grid-area: 1 / 3; }
  .p4 { grid-area: 2 / 1; } .p5 { grid-area: 2 / 2; } .p6 { grid-area: 2 / 3; }
  .p7 { grid-area: 3 / 1; } .p8 { grid-area: 3 / 2; } .p9 { grid-area: 3 / 3; }

  .total {
    font-size: clamp(1.1rem, 4vw, 1.5rem);
    min-height: 1.5em;
    opacity: .95;
  }
  .total b { color: var(--accent); font-size: 1.3em; }

  button {
    font: inherit;
    font-size: clamp(1.1rem, 4vw, 1.4rem);
    font-weight: 700;
    color: var(--pip);
    background: linear-gradient(180deg, #ffe27a, var(--accent));
    border: none;
    border-radius: 999px;
    padding: .8rem 2.4rem;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(255,212,71,.4);
    transition: transform .1s ease, box-shadow .1s ease;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(255,212,71,.5); }
  button:active { transform: translateY(1px) scale(.97); }
  button:disabled { opacity: .6; cursor: default; transform: none; }
</style>
</head>
<body>
  <h1>Tirar <span>Dados</span> 🎲</h1>

  <div class="dice" id="dice">
    <div class="die" id="die1"></div>
    <div class="die" id="die2"></div>
  </div>

  <div class="total" id="total">Presiona el botón para tirar</div>

  <button id="rollBtn">¡Tirar!</button>

<script>
  // Mapa de qué puntos se encienden para cada valor (posiciones en grilla 3x3)
  const FACES = {
    1: [5],
    2: [1, 9],
    3: [1, 5, 9],
    4: [1, 3, 7, 9],
    5: [1, 3, 5, 7, 9],
    6: [1, 3, 4, 6, 7, 9],
  };

  const die1 = document.getElementById('die1');
  const die2 = document.getElementById('die2');
  const totalEl = document.getElementById('total');
  const btn = document.getElementById('rollBtn');

  function render(dieEl, value) {
    dieEl.innerHTML = '';
    for (const pos of FACES[value]) {
      const pip = document.createElement('div');
      pip.className = 'pip p' + pos;
      dieEl.appendChild(pip);
    }
  }

  function randomDie() {
    return Math.floor(Math.random() * 6) + 1; // 1..6
  }

  function roll() {
    btn.disabled = true;
    totalEl.textContent = 'Tirando...';
    die1.classList.add('rolling');
    die2.classList.add('rolling');

    // Cambia de cara rápido para dar sensación de tirada
    const spin = setInterval(() => {
      render(die1, randomDie());
      render(die2, randomDie());
    }, 80);

    setTimeout(() => {
      clearInterval(spin);
      const v1 = randomDie();
      const v2 = randomDie();
      render(die1, v1);
      render(die2, v2);
      die1.classList.remove('rolling');
      die2.classList.remove('rolling');

      let msg = `${v1} + ${v2} = <b>${v1 + v2}</b>`;
      if (v1 === v2) msg += ' &nbsp;¡Dobles! 🎉';
      totalEl.innerHTML = msg;
      btn.disabled = false;
    }, 800);
  }

  btn.addEventListener('click', roll);

  // Estado inicial
  render(die1, 1);
  render(die2, 1);
</script>
</body>
</html>
